<!DOCTYPE html>
<html>
<body>

<h2>Text input fields</h2>

<form>
  <label for="fname">First name:</label><br>
  <input type="text" id="fname" name="fname"  placeholder="Enter your first name "><br>
  <label for="lname">Last name:</label><br>
  <input type="text" id="lname" name="lname" placeholder="Enter your last name "></br>
  <label for="h">Password</label><br>
  <input type="password" id="h" placeholder="ENTER"></br>
  <label for="bt" >Submit Button</label><br>
  <input type="button" id="bt" value="Submit" ></br>
  <label for="cb">Check box</label><br>
  <input type="checkbox" id="cb" ></br>
  <label for="ml" >Male</label>
  <input type="radio" id="ml" name="y" >
  <label for="fl" >Female</label>
  <input type="radio" id="fl" name="y">
  <label for="ol" >other</label>
  <input type="radio" id="ol" name="y">


</form>

<p>Note that the form itself is not visible.</p>

<p>Also note that the default width of text input fields is 20 characters.</p>

</body>
</html>
